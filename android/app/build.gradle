apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
// SceneView 4.18.0's ARSceneView is a Jetpack Compose composable; the native AR
// views host it in a ComposeView, so this module needs the Compose compiler.
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.epocheye"

    // Jetpack Compose — required to host SceneView 4.18.0's ARSceneView composable.
    // buildConfig — exposes OTA_RUNTIME_VERSION to native code (BuildConfig).
    buildFeatures {
        compose true
        buildConfig true
    }

    defaultConfig {
        applicationId "com.epocheye"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 26
        versionName "1.5.0"
        // OTA Hermes-compat runtime version. The client only fetches/accepts OTA
        // bundles built for this exact value. Bump ONLY when a native/store build
        // ships (new native code, new native dep, RN upgrade) — NOT for JS-only
        // releases. Must equal the `runtime_version` passed to tools/ota-publish.mjs.
        buildConfigField "String", "OTA_RUNTIME_VERSION", "\"1.5.0\""
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // Distribution: Google Play App Bundle (./gradlew bundleRelease).
    // ABI selection is handled by ndk.abiFilters above (arm64-v8a +
    // armeabi-v7a, excluding x86 emulator libs). The App Bundle splits per
    // device on the Play side, so a `splits { abi { ... } }` block (an
    // APK-only mechanism) is intentionally NOT used — it conflicts with
    // ndk.abiFilters during bundleRelease and would only matter for fat-APK
    // distribution, which we don't ship.

    // Prevent duplicate native library errors when reanimated and
    // vision-camera ship the same shared libs.
    packagingOptions {
        jniLibs {
            // Store .so uncompressed and 16 KB-page-aligned in the AAB/APK
            // (Google Play 16 KB page-size requirement). This is the AGP default
            // on modern targets, but we set it explicitly so a future SDK/AGP
            // change can't silently re-enable legacy (compressed, 4 KB) packaging.
            useLegacyPackaging false
            pickFirsts += [
                '**/libc++_shared.so',
                '**/libfbjni.so',
            ]
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // ARCore + SceneView for 3D-anchored heritage info cards.
    // SceneView 4.18.0 brings 16 KB-aligned Filament 1.71.5 native libs (the old
    // 2.2.1 pulled Filament 1.52.0, whose .so were only 4 KB-aligned → Google Play
    // "does not support 16 KB memory page size" warning on API 35+ targets).
    implementation 'com.google.ar:core:1.44.0'
    implementation 'io.github.sceneview:arsceneview:4.18.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'

    // ADMIN-HARNESS (REMOVE AFTER KONARK)
    // ARCore API KEYLESS auth for the admin harness (Cloud Anchors + Geospatial).
    // ARCore discovers this at runtime via reflection — no code imports it. Now
    // `implementation` (was debugImplementation) so the RELEASE variant carries it:
    // the Geospatial harness authorizes against the ARCore API in release too.
    // (react-native-firebase_app also pulls 21.5.0 transitively; this makes it
    // explicit.) NOTE: keyless auth binds (package, SHA-1) — the RELEASE keystore's
    // SHA-1 must be registered as an Android OAuth client in the same GCP project,
    // else geospatial returns ERROR_NOT_AUTHORIZED in release.
    implementation 'com.google.android.gms:play-services-auth:21.5.0'

    // Jetpack Compose — the native AR views host SceneView 4.18.0's ARSceneView
    // composable inside a ComposeView. BOM matches the one arsceneview 4.18.0
    // resolves (compose-bom 2026.05.01) so runtime/ui versions stay aligned.
    implementation platform('androidx.compose:compose-bom:2026.05.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.11.0'
}
